name: Build da aplicação

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar uv e Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: uv sync --locked

      # Bibliotecas de sistema que o Qt precisa mesmo sem tela (plataforma offscreen)
      - name: Instalar bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Rodar testes
        run: uv run --locked pytest -q

      - name: Gerar executável
        run: |
          uv run --locked --with pyinstaller pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name MemphisVDebugger \
            --add-data "images:images" \
            --add-data "icon:icon" \
            --add-data "color_spectrum.png:." \
            main.py

      - name: Conferir executável
        run: test -x dist/MemphisVDebugger/MemphisVDebugger
